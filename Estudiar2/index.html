<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Tecno Store</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Tecno Store</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#Productos">Productos</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#Contacto">Contacto</a>
                    </li>
                </ul>
                </div>
            </div>
            </nav>
    </header>


    <main>

        <section>
            <div class="container-fluid mx-auto my-3 text-center">
                <h1>Tecnología para todos</h1>
                <p>Los mejores productos al mejor precio.</p>
                <img  src="img/laptop.webp" width="100%" class="img-fluid" alt="Laptop" style="max-height: 400px;">
            </div>
        </section>


        <section id="Productos">
            <div class="container-fluid bg-dark text-light py-3">
                <div class="row">
                    <h2 class="stilo">Productos</h2>
                    <div class="col-sm-12 col-md-12 col-lg-4 py-1">
                        <div class="card">
                            <img src="img/laptop3.webp" 
                                 class="card-img-top img-fluid" style="max-height: 300px;">
                            <div class="card-body">
                                <h5 class="card-title">
                                    Laptop
                                </h5>
                                <p class="card-text">
                                    Laptop para estudiantes.
                                </p>
                                <button id="complaptop" class="btn btn-primary">
                                    Comprar
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-12 col-md-12 col-lg-4 py-1">
                        <div class="card">
                            <img src="img/celular.jpg" 
                                 class="card-img-top img-fluid" style="max-height: 300px;">
                            <div class="card-body">
                                <h5 class="card-title">
                                    Celular
                                </h5>
                                <p class="card-text">
                                    Celular de última generación.
                                </p>
                                <button id="compcelular" class="btn btn-primary">
                                    Comprar
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-sm-12 col-md-12 col-lg-4 py-1">
                        <div class="card">
                            <img src="img/audifonos.jpeg" 
                                 class="card-img-top img-fluid" style="max-height: 300px;">
                            <div class="card-body">
                                <h5 class="card-title">
                                    Audífonos
                                </h5>
                                <p class="card-text">
                                    Sonido de alta y excelente calidad.
                                </p>
                                <button id="compaudifonos" class="btn btn-primary">
                                    Comprar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="container-fluid bg-dark text-light" id="Contacto">
            <h2 class="px-4 stilo">Contacto</h2>

            <form id="formulario">
                <div class="row">
                    <div class="col-12 col-md-4 col-lg-4">
                        <div class="input-group flex-nowrap px-5">
                            <span class="input-group-text">Nombre</span>
                            <input type="text" class="form-control" id="nombre" placeholder="Nombre" aria-label="Username" aria-describedby="addon-wrapping">
                        </div>
                    </div>
                    <div class="col-12 col-md-4 col-lg-4">
                        <div class="input-group flex-nowrap px-5">
                            <span class="input-group-text">@</span>
                            <input type="email" class="form-control" id="correo" placeholder="Correo electrónico" aria-label="Username" aria-describedby="addon-wrapping">
                        </div>
                    </div>
                    <div class="col px-5 mt-3 mt-md-0 mt-lg-0 pb-3">
                        <button class="btn btn-success" type="submit">
                            Enviar
                        </button>
                    </div>
                </div>
            </form>
        </section>

    </main>

    <footer>
        <div class="container-fluid text-center bg-body-tertiary text-dark pb-2 pt-2" >
            <p>TECNO STORE 2026</p>
        </div>
        <div id="mensaje">Contact</div>
    </footer>

    <script src="bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
