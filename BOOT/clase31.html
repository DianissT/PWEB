<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Mi tienda</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilo2.css">
</head>

<body>

    <header>

            <nav class="navbar navbar-expand-lg barra">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">MI TIENDA</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="#">Inicio</a>
                    <a class="nav-link" href="#seccion1">Productos</a>
                    <a class="nav-link" href="#seccion2">Contactos</a>
                </div>
                </div>
            </div>
            </nav>

            <div class="container-fluid px-0 principal">
                <img src="img/flores-en-italiano.webp" class="img-fluid w-100" alt="Imagen principal">
            </div>

    </header>


    <main>

        <section>

            <div class="container-fluid px-0 mb-4 sc1 text-center">
                <a id="seccion1"></a>
                <h2 class="productos">Productos</h2>
                <div class="row">
                    <div class="col-sm-12 col-md-6 mt-2 mb-2">
                        <h3>Producto 1</h3>
                        <p>Producto de excelente calidad</p>
                        <button class="btn btn-success mi-boton">Comprar</button>
                    </div>
                    <div class="col-sm-12 col-md-6 mt-2 mb-2">
                        <h3>Producto 2</h3>
                        <p>Producto económico</p>
                        <button class="btn btn-success mi-boton">Comprar</button>
                    </div>
                </div>
            </div>
        </section>

        <section>


            <div class="container pt-4 pb-4">     
                <a id="seccion2"></a>
                <h2>Contacto</h2>
                        <form id="formulario">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" aria-describedby="nameHelp">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
                            </div>
                            <button type="submit" class="btn btn-primary">Enviar</button>
                        </form>
            </div>
            
        </section>

    </main>

    <!-- JS LINKS-->
    <script src="bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/prueba.js"></script>   

</body>

</html>
